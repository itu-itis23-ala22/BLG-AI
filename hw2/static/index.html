<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Web Crawler</title>
<style>
  /* ── Reset & base ── */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg:        #0f1117;
    --surface:   #1a1d27;
    --border:    #2a2d3e;
    --accent:    #6c63ff;
    --accent2:   #a78bfa;
    --success:   #34d399;
    --warn:      #fbbf24;
    --danger:    #f87171;
    --text:      #e2e8f0;
    --muted:     #8892a4;
    --code:      #1e2130;
    --radius:    8px;
    --shadow:    0 4px 24px rgba(0,0,0,.4);
  }
  body {
    font-family: 'Inter', system-ui, sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }

  /* ── Top bar ── */
  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
    position: sticky; top: 0; z-index: 100;
  }
  header .logo { font-size: 20px; font-weight: 700; color: var(--accent2); letter-spacing: -.5px; }
  header .logo span { color: var(--accent); }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%;
    background: var(--muted); margin-left: auto;
    transition: background .4s;
  }
  .status-dot.active { background: var(--success); box-shadow: 0 0 8px var(--success); }
  #hdr-stats { font-size: 12px; color: var(--muted); }

  /* ── Nav ── */
  nav {
    display: flex;
    gap: 4px;
    padding: 0 28px;
    background: var(--surface);
    border-bottom: 1px solid var(--border);
  }
  nav button {
    background: none; border: none; cursor: pointer;
    color: var(--muted);
    font-size: 14px; font-weight: 500;
    padding: 12px 16px;
    border-bottom: 2px solid transparent;
    transition: color .2s, border-color .2s;
  }
  nav button.active { color: var(--text); border-bottom-color: var(--accent); }
  nav button:hover { color: var(--text); }

  /* ── Layout ── */
  main { flex: 1; padding: 28px; max-width: 1100px; width: 100%; margin: 0 auto; }
  .page { display: none; }
  .page.active { display: block; }

  /* ── Cards ── */
  .card {
    background: var(--surface);
    border: 1px solid var(--border);
    border-radius: var(--radius);
    padding: 24px;
    margin-bottom: 20px;
    box-shadow: var(--shadow);
  }
  .card-title {
    font-size: 13px; font-weight: 600; text-transform: uppercase;
    letter-spacing: .08em; color: var(--muted); margin-bottom: 18px;
  }

  /* ── Forms ── */
  .form-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 14px; }
  .field { display: flex; flex-direction: column; gap: 6px; }
  .field.full { grid-column: 1 / -1; }
  label { font-size: 12px; font-weight: 500; color: var(--muted); }
  input[type=text], input[type=number], input[type=url] {
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    color: var(--text);
    font-size: 14px;
    padding: 9px 12px;
    outline: none;
    transition: border-color .2s;
  }
  input:focus { border-color: var(--accent); }
  input::placeholder { color: var(--muted); }

  /* ── Buttons ── */
  .btn {
    display: inline-flex; align-items: center; gap: 6px;
    padding: 9px 18px; border-radius: 6px; border: none;
    font-size: 14px; font-weight: 600; cursor: pointer;
    transition: opacity .2s, transform .1s;
  }
  .btn:active { transform: scale(.97); }
  .btn:disabled { opacity: .45; cursor: not-allowed; }
  .btn-primary   { background: var(--accent);  color: #fff; }
  .btn-success   { background: var(--success); color: #0f1117; }
  .btn-danger    { background: var(--danger);  color: #0f1117; }
  .btn-ghost     { background: transparent; border: 1px solid var(--border); color: var(--text); }
  .btn-sm        { padding: 5px 10px; font-size: 12px; }

  /* ── Badges ── */
  .badge {
    display: inline-block; padding: 2px 8px; border-radius: 99px;
    font-size: 11px; font-weight: 600;
  }
  .badge-running  { background: rgba(99,179,237,.18); color: #63b3ed; }
  .badge-completed{ background: rgba(52,211,153,.18); color: var(--success); }
  .badge-stopped  { background: rgba(251,191,36,.18); color: var(--warn); }
  .badge-pending  { background: rgba(139,92,246,.18); color: var(--accent2); }
  .badge-bp       { background: rgba(248,113,113,.18); color: var(--danger); font-size: 10px; }

  /* ── Job list ── */
  .job-list { display: flex; flex-direction: column; gap: 10px; }
  .job-row {
    display: grid;
    grid-template-columns: 1fr auto auto auto auto;
    align-items: center;
    gap: 12px;
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 12px 16px;
    cursor: pointer;
    transition: border-color .2s;
  }
  .job-row:hover { border-color: var(--accent); }
  .job-url { font-size: 13px; font-weight: 500; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .job-meta { font-size: 11px; color: var(--muted); }

  /* ── Progress bar ── */
  .progress { background: var(--border); border-radius: 99px; height: 4px; overflow: hidden; }
  .progress-inner { height: 100%; background: var(--accent); border-radius: 99px; transition: width .4s; }

  /* ── Log viewer ── */
  #log-container {
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    height: 340px;
    overflow-y: auto;
    padding: 12px 14px;
    font-family: 'Fira Mono', 'Consolas', monospace;
    font-size: 12px;
    line-height: 1.7;
  }
  .log-line { display: flex; gap: 10px; }
  .log-line .ts  { color: var(--muted); white-space: nowrap; }
  .log-line .lvl-INFO { color: var(--muted); }
  .log-line .lvl-WARN { color: var(--warn); }
  .log-line .lvl-ERROR{ color: var(--danger); }
  .log-line .msg { color: var(--text); word-break: break-all; }

  /* ── Stats grid ── */
  .stats-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 12px; }
  .stat-box {
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 16px;
    text-align: center;
  }
  .stat-val { font-size: 28px; font-weight: 700; color: var(--accent2); line-height: 1; }
  .stat-label { font-size: 11px; color: var(--muted); margin-top: 4px; }

  /* ── Back-pressure indicator ── */
  .bp-bar {
    display: flex; align-items: center; gap: 10px;
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 10px 14px;
    font-size: 12px;
  }
  .bp-label { color: var(--muted); min-width: 100px; }
  .bp-track { flex: 1; background: var(--border); border-radius: 99px; height: 6px; overflow: hidden; }
  .bp-fill  { height: 100%; border-radius: 99px; background: var(--success); transition: width .5s, background .5s; }
  .bp-fill.warn   { background: var(--warn); }
  .bp-fill.danger { background: var(--danger); }
  .bp-val { min-width: 60px; text-align: right; color: var(--text); }

  /* ── Search results ── */
  .result-list { display: flex; flex-direction: column; gap: 12px; }
  .result-item {
    background: var(--code);
    border: 1px solid var(--border);
    border-radius: 6px;
    padding: 14px 16px;
    transition: border-color .2s;
  }
  .result-item:hover { border-color: var(--accent2); }
  .result-url { font-size: 14px; font-weight: 600; }
  .result-url a { color: var(--accent2); text-decoration: none; word-break: break-all; }
  .result-url a:hover { text-decoration: underline; }
  .result-meta { font-size: 11px; color: var(--muted); margin-top: 4px; display: flex; gap: 12px; flex-wrap: wrap; }
  .result-title { font-size: 12px; color: var(--text); margin-top: 4px; }
  .no-results { color: var(--muted); font-size: 14px; text-align: center; padding: 40px; }

  /* ── Alerts ── */
  .alert {
    padding: 10px 14px; border-radius: 6px;
    font-size: 13px; margin-bottom: 16px;
  }
  .alert-error   { background: rgba(248,113,113,.12); border: 1px solid var(--danger); color: var(--danger); }
  .alert-success { background: rgba(52,211,153,.12);  border: 1px solid var(--success); color: var(--success); }

  /* ── Misc ── */
  .section-title { font-size: 16px; font-weight: 700; margin-bottom: 16px; }
  .empty-state { color: var(--muted); font-size: 13px; padding: 20px 0; text-align: center; }
  .flex { display: flex; }
  .gap-2 { gap: 8px; }
  .mt-4 { margin-top: 16px; }
  .mt-2 { margin-top: 8px; }
  hr.sep { border: none; border-top: 1px solid var(--border); margin: 20px 0; }
  .spinner {
    display: inline-block; width: 14px; height: 14px;
    border: 2px solid rgba(255,255,255,.3);
    border-top-color: #fff; border-radius: 50%;
    animation: spin .6s linear infinite;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .hidden { display: none !important; }
</style>
</head>
<body>

<!-- ── Header ── -->
<header>
  <div class="logo">web<span>crawler</span></div>
  <div id="hdr-stats">— pages indexed</div>
  <div class="status-dot" id="sys-dot" title="Active crawl running"></div>
</header>

<!-- ── Nav ── -->
<nav>
  <button class="active" onclick="showPage('crawl',this)">🕷 Crawl</button>
  <button onclick="showPage('status',this)">📊 Status</button>
  <button onclick="showPage('search',this)">🔍 Search</button>
</nav>

<!-- ── Main ── -->
<main>

  <!-- ═══════════════════════════ CRAWL PAGE ════════════════════════════ -->
  <div class="page active" id="page-crawl">
    <div class="card">
      <div class="card-title">New Crawl Job</div>
      <div id="crawl-alert" class="hidden"></div>
      <div class="form-grid">
        <div class="field full">
          <label>Origin URL *</label>
          <input type="url" id="origin" placeholder="https://example.com" />
        </div>
        <div class="field">
          <label>Max Depth (k) *</label>
          <input type="number" id="depth" value="2" min="0" max="10" />
        </div>
        <div class="field">
          <label>Rate Limit (req/s)</label>
          <input type="number" id="rate" value="5" min="0.1" max="100" step="0.5" />
        </div>
        <div class="field">
          <label>Max Queue Depth</label>
          <input type="number" id="queue" value="1000" min="10" />
        </div>
        <div class="field">
          <label>Workers</label>
          <input type="number" id="workers" value="5" min="1" max="50" />
        </div>
        <div class="field">
          <label>Max Pages (optional)</label>
          <input type="number" id="maxpages" placeholder="unlimited" min="1" />
        </div>
      </div>
      <div class="mt-4">
        <button class="btn btn-primary" id="btn-crawl" onclick="startCrawl()">
          <span class="spinner hidden" id="crawl-spin"></span>
          Start Crawl
        </button>
      </div>
    </div>

    <div class="card">
      <div class="card-title">Recent Jobs</div>
      <div id="job-list" class="job-list">
        <div class="empty-state">No crawl jobs yet.</div>
      </div>
    </div>
  </div>


  <!-- ══════════════════════════ STATUS PAGE ═══════════════════════════ -->
  <div class="page" id="page-status">
    <div class="card">
      <div class="card-title">System Overview</div>
      <div class="stats-grid" id="sys-stats">
        <div class="stat-box"><div class="stat-val" id="st-total-pages">—</div><div class="stat-label">Pages Indexed</div></div>
        <div class="stat-box"><div class="stat-val" id="st-running">—</div><div class="stat-label">Running Jobs</div></div>
        <div class="stat-box"><div class="stat-val" id="st-total-jobs">—</div><div class="stat-label">Total Jobs</div></div>
        <div class="stat-box"><div class="stat-val" id="st-failed">—</div><div class="stat-label">Pages Failed</div></div>
      </div>
    </div>

    <div id="running-jobs-section" class="hidden">
      <div class="section-title">Active Jobs</div>
      <div id="running-jobs"></div>
    </div>

    <div class="card">
      <div class="card-title">All Jobs</div>
      <div id="all-jobs-status" class="job-list">
        <div class="empty-state">No jobs yet.</div>
      </div>
    </div>
  </div>


  <!-- ═══════════════════════════ SEARCH PAGE ══════════════════════════ -->
  <div class="page" id="page-search">
    <div class="card">
      <div class="card-title">Search Indexed Pages</div>
      <div class="flex gap-2">
        <input type="text" id="search-q" placeholder="Enter search terms…" style="flex:1"
               onkeydown="if(event.key==='Enter') doSearch()" />
        <input type="number" id="search-limit" value="50" min="1" max="500"
               style="width:80px" title="Max results" />
        <button class="btn btn-success" onclick="doSearch()">Search</button>
      </div>
      <div class="mt-2" style="font-size:12px; color:var(--muted)">
        Filter by job (optional):
        <input type="text" id="search-job" placeholder="job_id" style="width:170px; margin-left:6px" />
      </div>
    </div>

    <div id="search-status" class="hidden"></div>
    <div id="search-results" class="result-list"></div>
  </div>

</main>


<!-- ── Job detail modal ── -->
<div id="modal-overlay"
     style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:200;
            overflow-y:auto;padding:32px 16px;"
     onclick="if(event.target===this)closeModal()">
  <div style="background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
              max-width:820px;margin:0 auto;padding:28px;position:relative;">
    <button onclick="closeModal()"
            style="position:absolute;top:14px;right:14px;background:none;border:none;
                   color:var(--muted);font-size:18px;cursor:pointer;">✕</button>
    <div id="modal-content"></div>
  </div>
</div>

<script>
/* ════════════════════════════════════════════════
   Utilities
   ════════════════════════════════════════════════ */
const $ = id => document.getElementById(id);

function showPage(name, btn) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('nav button').forEach(b => b.classList.remove('active'));
  $('page-' + name).classList.add('active');
  btn.classList.add('active');
  if (name === 'status') refreshStatus();
}

function fmtTime(epoch) {
  if (!epoch) return '—';
  return new Date(epoch * 1000).toLocaleString();
}
function fmtDuration(created, completed) {
  if (!created) return '—';
  const end = completed || Date.now() / 1000;
  const s = Math.round(end - created);
  if (s < 60) return s + 's';
  if (s < 3600) return Math.round(s/60) + 'm';
  return Math.round(s/3600) + 'h ' + Math.round((s%3600)/60) + 'm';
}

function statusBadge(s) {
  const cls = { running:'badge-running', completed:'badge-completed',
                stopped:'badge-stopped', pending:'badge-pending' };
  return `<span class="badge ${cls[s]||''}">${s}</span>`;
}

function showAlert(containerId, msg, type='error') {
  const el = $(containerId);
  el.className = `alert alert-${type}`;
  el.textContent = msg;
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 5000);
}

/* ════════════════════════════════════════════════
   CRAWL page
   ════════════════════════════════════════════════ */
async function startCrawl() {
  const origin  = $('origin').value.trim();
  const k       = parseInt($('depth').value);
  const rate    = parseFloat($('rate').value);
  const maxQ    = parseInt($('queue').value);
  const workers = parseInt($('workers').value);
  const maxP    = $('maxpages').value ? parseInt($('maxpages').value) : null;

  if (!origin) return showAlert('crawl-alert', 'Origin URL is required');
  if (isNaN(k) || k < 0) return showAlert('crawl-alert', 'Depth must be >= 0');

  $('btn-crawl').disabled = true;
  $('crawl-spin').classList.remove('hidden');

  try {
    const res = await fetch('/api/index', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ origin, k, rate_limit: rate, max_queue: maxQ,
                              num_workers: workers, max_pages: maxP })
    });
    if (!res.ok) {
      const err = await res.json();
      throw new Error(err.detail || 'Server error');
    }
    const data = await res.json();
    showAlert('crawl-alert', `Job ${data.job_id} started`, 'success');
    refreshJobs();
  } catch(e) {
    showAlert('crawl-alert', e.message);
  } finally {
    $('btn-crawl').disabled = false;
    $('crawl-spin').classList.add('hidden');
  }
}

async function refreshJobs() {
  const res  = await fetch('/api/jobs');
  const jobs = await res.json();
  const el   = $('job-list');

  if (!jobs.length) { el.innerHTML = '<div class="empty-state">No crawl jobs yet.</div>'; return; }

  el.innerHTML = jobs.map(j => `
    <div class="job-row" onclick="openJobModal('${j.id}')">
      <div>
        <div class="job-url" title="${j.origin_url}">${j.origin_url}</div>
        <div class="job-meta">
          depth&nbsp;${j.max_depth} &nbsp;·&nbsp;
          ${j.pages_crawled} pages &nbsp;·&nbsp;
          ${fmtTime(j.created_at)}
        </div>
      </div>
      ${statusBadge(j.status)}
      <div style="font-size:12px;color:var(--muted)">${fmtDuration(j.created_at, j.completed_at)}</div>
      <div style="font-size:11px;color:var(--muted)">k=${j.max_depth}</div>
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openJobModal('${j.id}')">Detail</button>
    </div>
  `).join('');
}

/* ════════════════════════════════════════════════
   STATUS page
   ════════════════════════════════════════════════ */
async function refreshStatus() {
  const res  = await fetch('/api/status');
  const data = await res.json();

  $('st-total-pages').textContent = data.total_pages_indexed.toLocaleString();
  $('st-running').textContent     = data.running_jobs.length;
  $('st-total-jobs').textContent  = data.total_jobs;
  $('st-failed').textContent      = data.total_pages_failed.toLocaleString();

  // Header dot
  const dot = $('sys-dot');
  dot.classList.toggle('active', data.running_jobs.length > 0);
  $('hdr-stats').textContent = `${data.total_pages_indexed.toLocaleString()} pages indexed`;

  // Running jobs
  const rjSec = $('running-jobs-section');
  if (data.running_jobs.length) {
    rjSec.classList.remove('hidden');
    $('running-jobs').innerHTML = data.running_jobs.map(j => renderRunningJob(j)).join('');
  } else {
    rjSec.classList.add('hidden');
  }

  // All-jobs table
  const res2 = await fetch('/api/jobs');
  const jobs = await res2.json();
  const el   = $('all-jobs-status');
  if (!jobs.length) { el.innerHTML = '<div class="empty-state">No jobs yet.</div>'; return; }
  el.innerHTML = jobs.map(j => `
    <div class="job-row" onclick="openJobModal('${j.id}')">
      <div>
        <div class="job-url" title="${j.origin_url}">${j.origin_url}</div>
        <div class="job-meta">id: ${j.id} &nbsp;·&nbsp; ${fmtTime(j.created_at)}</div>
      </div>
      ${statusBadge(j.status)}
      <div style="font-size:12px;color:var(--muted)">${j.pages_crawled} pages</div>
      <div style="font-size:11px;color:var(--muted)">k=${j.max_depth}</div>
      <button class="btn btn-ghost btn-sm" onclick="event.stopPropagation();openJobModal('${j.id}')">Detail</button>
    </div>
  `).join('');
}

function renderRunningJob(j) {
  const qPct     = Math.min(100, Math.round((j.queue_depth  / Math.max(j.max_queue,  1)) * 100));
  const pendPct  = Math.min(100, Math.round((j.pending_depth/ Math.max(j.max_queue,  1)) * 100));
  const qClass   = qPct >= 90 ? 'danger' : qPct >= 60 ? 'warn' : '';

  return `
  <div class="card" style="margin-bottom:16px">
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:12px">
      <div style="font-size:14px;font-weight:600;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
           title="${j.origin_url}">${j.origin_url}</div>
      ${statusBadge(j.status)}
      ${j.back_pressure_active ? '<span class="badge badge-bp">⚠ back-pressure</span>' : ''}
      <button class="btn btn-danger btn-sm" onclick="stopJob('${j.id}')">Stop</button>
    </div>

    <div class="stats-grid" style="grid-template-columns:repeat(4,1fr);gap:10px;margin-bottom:14px">
      <div class="stat-box"><div class="stat-val" style="font-size:20px">${j.pages_crawled}</div><div class="stat-label">Crawled</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:20px">${j.pages_failed}</div><div class="stat-label">Failed</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:20px">${j.queue_depth}</div><div class="stat-label">Queue</div></div>
      <div class="stat-box"><div class="stat-val" style="font-size:20px">${j.pending_depth||0}</div><div class="stat-label">Pending (DB)</div></div>
    </div>

    <div style="display:flex;flex-direction:column;gap:8px">
      <div class="bp-bar">
        <span class="bp-label">In-memory queue</span>
        <div class="bp-track"><div class="bp-fill ${qClass}" style="width:${qPct}%"></div></div>
        <span class="bp-val">${j.queue_depth} / ${j.max_queue}</span>
      </div>
      <div class="bp-bar">
        <span class="bp-label">DB overflow</span>
        <div class="bp-track"><div class="bp-fill ${pendPct>0?'warn':''}" style="width:${pendPct}%"></div></div>
        <span class="bp-val">${j.pending_depth||0} pending</span>
      </div>
    </div>

    <div class="mt-2" style="font-size:11px;color:var(--muted)">
      depth ${j.max_depth} &nbsp;·&nbsp; ${j.rate_limit} req/s &nbsp;·&nbsp;
      ${j.num_workers} workers &nbsp;·&nbsp; started ${fmtTime(j.created_at)}
    </div>
  </div>`;
}

async function stopJob(id) {
  await fetch(`/api/jobs/${id}/stop`, { method: 'POST' });
  refreshStatus();
}

/* ════════════════════════════════════════════════
   SEARCH page
   ════════════════════════════════════════════════ */
async function doSearch() {
  const q     = $('search-q').value.trim();
  const limit = parseInt($('search-limit').value) || 50;
  const jobId = $('search-job').value.trim();

  if (!q) return;

  const st = $('search-status');
  st.className = 'alert alert-success hidden';
  $('search-results').innerHTML = '<div class="empty-state"><div class="spinner" style="display:inline-block"></div></div>';

  try {
    const res  = await fetch('/api/search', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ query: q, limit, job_id: jobId })
    });
    const data = await res.json();

    st.className = 'alert alert-success';
    st.textContent = `${data.total} result(s) for "${data.query}"`;
    st.classList.remove('hidden');

    if (!data.results.length) {
      $('search-results').innerHTML = '<div class="no-results">No results found.</div>';
      return;
    }

    $('search-results').innerHTML = data.results.map((r, i) => `
      <div class="result-item">
        <div class="result-url"><a href="${r.relevant_url}" target="_blank">${r.relevant_url}</a></div>
        ${r.title ? `<div class="result-title">${escHtml(r.title)}</div>` : ''}
        <div class="result-meta">
          <span>origin: <strong>${escHtml(r.origin_url)}</strong></span>
          <span>depth: <strong>${r.depth}</strong></span>
          <span>job: <strong>${r.job_id}</strong></span>
          <span>score: <strong>${Math.abs(r.score).toFixed(3)}</strong></span>
        </div>
      </div>
    `).join('');
  } catch(e) {
    $('search-results').innerHTML = `<div class="no-results" style="color:var(--danger)">${e.message}</div>`;
  }
}

function escHtml(s) {
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

/* ════════════════════════════════════════════════
   Job detail modal
   ════════════════════════════════════════════════ */
let _modalJobId   = null;
let _logPollTimer = null;
let _lastLogId    = 0;

async function openJobModal(id) {
  _modalJobId = id;
  _lastLogId  = 0;
  $('modal-overlay').style.display = 'block';
  await renderModal();
  startLogPoll();
}

function closeModal() {
  $('modal-overlay').style.display = 'none';
  clearTimeout(_logPollTimer);
  _modalJobId = null;
}

async function renderModal() {
  const res = await fetch(`/api/jobs/${_modalJobId}`);
  const job = await res.json();

  const running = job.status === 'running';
  const qPct    = Math.min(100, Math.round((job.queue_depth   / Math.max(job.max_queue,1))*100));
  const pPct    = Math.min(100, Math.round(((job.pending_depth||0) / Math.max(job.max_queue,1))*100));

  $('modal-content').innerHTML = `
    <div style="display:flex;align-items:center;gap:10px;margin-bottom:20px;flex-wrap:wrap">
      <div style="font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap"
           title="${job.origin_url}">${job.origin_url}</div>
      ${statusBadge(job.status)}
      ${job.back_pressure_active ? '<span class="badge badge-bp">⚠ back-pressure</span>' : ''}
      ${running ? `<button class="btn btn-danger btn-sm" onclick="stopJob('${job.id}');closeModal()">Stop Job</button>` : ''}
    </div>

    <div class="stats-grid" style="margin-bottom:16px">
      <div class="stat-box"><div class="stat-val">${job.pages_crawled}</div><div class="stat-label">Crawled</div></div>
      <div class="stat-box"><div class="stat-val">${job.pages_failed}</div><div class="stat-label">Failed</div></div>
      <div class="stat-box"><div class="stat-val">${job.queue_depth}</div><div class="stat-label">Queue</div></div>
      <div class="stat-box"><div class="stat-val">${job.pending_depth||0}</div><div class="stat-label">Pending</div></div>
    </div>

    ${running ? `
    <div style="display:flex;flex-direction:column;gap:8px;margin-bottom:16px">
      <div class="bp-bar">
        <span class="bp-label">In-memory queue</span>
        <div class="bp-track"><div class="bp-fill ${qPct>=90?'danger':qPct>=60?'warn':''}" style="width:${qPct}%"></div></div>
        <span class="bp-val">${job.queue_depth} / ${job.max_queue}</span>
      </div>
      <div class="bp-bar">
        <span class="bp-label">DB overflow</span>
        <div class="bp-track"><div class="bp-fill ${pPct>0?'warn':''}" style="width:${pPct}%"></div></div>
        <span class="bp-val">${job.pending_depth||0} pending</span>
      </div>
    </div>` : ''}

    <div style="display:grid;grid-template-columns:1fr 1fr;gap:8px;font-size:12px;
                color:var(--muted);margin-bottom:16px">
      <div>Job ID: <strong style="color:var(--text)">${job.id}</strong></div>
      <div>Depth: <strong style="color:var(--text)">${job.max_depth}</strong></div>
      <div>Rate: <strong style="color:var(--text)">${job.rate_limit} req/s</strong></div>
      <div>Workers: <strong style="color:var(--text)">${job.num_workers}</strong></div>
      <div>Max pages: <strong style="color:var(--text)">${job.max_pages||'unlimited'}</strong></div>
      <div>Max queue: <strong style="color:var(--text)">${job.max_queue}</strong></div>
      <div>Started: <strong style="color:var(--text)">${fmtTime(job.created_at)}</strong></div>
      <div>Duration: <strong style="color:var(--text)">${fmtDuration(job.created_at, job.completed_at)}</strong></div>
    </div>

    <div class="card-title">Live Log</div>
    <div id="log-container"></div>
  `;

  // Load initial logs
  await loadLogs(true);
}

async function loadLogs(reset = false) {
  if (!_modalJobId) return;
  if (reset) { _lastLogId = 0; $('log-container').innerHTML = ''; }

  const res  = await fetch(`/api/jobs/${_modalJobId}/logs?after=${_lastLogId}&limit=200`);
  const logs = await res.json();
  if (!logs.length) return;

  _lastLogId = logs[logs.length-1].id;
  const box  = $('log-container');
  const atBottom = box.scrollHeight - box.scrollTop - box.clientHeight < 60;

  logs.forEach(l => {
    const line = document.createElement('div');
    line.className = 'log-line';
    const t = new Date(l.created_at * 1000);
    const ts = t.toTimeString().slice(0,8);
    line.innerHTML = `<span class="ts">${ts}</span>`
                   + `<span class="lvl-${l.level}">[${l.level}]</span>`
                   + `<span class="msg">${escHtml(l.message)}</span>`;
    box.appendChild(line);
  });

  if (atBottom) box.scrollTop = box.scrollHeight;
}

function startLogPoll() {
  clearTimeout(_logPollTimer);
  _logPollTimer = setTimeout(async () => {
    if (!_modalJobId) return;
    const job = await (await fetch(`/api/jobs/${_modalJobId}`)).json();
    await loadLogs(false);
    // Refresh stats in modal header if still running
    if (job.status === 'running') {
      startLogPoll();
    }
  }, 2000);
}

/* ════════════════════════════════════════════════
   Global polling
   ════════════════════════════════════════════════ */
async function globalPoll() {
  try {
    const res  = await fetch('/api/status');
    const data = await res.json();
    $('sys-dot').classList.toggle('active', data.running_jobs.length > 0);
    $('hdr-stats').textContent = `${data.total_pages_indexed.toLocaleString()} pages indexed`;

    // Refresh status page if active
    if ($('page-status').classList.contains('active')) refreshStatus();
    // Refresh job list if crawl page active
    if ($('page-crawl').classList.contains('active'))  refreshJobs();
  } catch(_) {}
  setTimeout(globalPoll, 4000);
}

/* ════════════════════════════════════════════════
   Boot
   ════════════════════════════════════════════════ */
refreshJobs();
globalPoll();
</script>
